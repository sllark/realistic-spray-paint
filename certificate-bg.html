<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Spray + Certificate Stencil</title>
    <link rel="stylesheet" href="styles.css" />
    <style>
      @font-face {
        font-family: "ArchimotoV01-Regular";
        src: url("assets/fonts/ArchimotoV01-Regular.otf") format("opentype");
        font-weight: 100;
        font-style: normal;
        font-display: swap;
      }

      :root {
        --bg: #e4e1ce;
      }

      html,
      body {
        height: 100%;
      }

      body.certificate {
        background: var(--bg) url("assets/bg-2.webp") center / cover no-repeat
          fixed;
        margin: 0;
        font-family: "ArchimotoV01-Regular", system-ui, -apple-system, Segoe UI,
          Roboto, Helvetica, Arial, sans-serif;
        min-height: 100svh;
      }

      #stencilApp {
        display: flex;
        flex-direction: column;
        justify-content: center;
        padding-bottom: calc(env(safe-area-inset-bottom) + 60px);
        min-height: 100svh;
        height: 100svh;
      }

      .stage {
        position: relative;
        flex: 0 0 auto;
        min-height: 0;
        margin: 0 auto;
        border-radius: 10px;
        /* overflow: hidden; */
        box-shadow: 0 10px 30px rgba(0, 0, 0, 0.18);
      }

      .stage-bg {
        position: absolute;
        inset: 0;
        width: 100%;
        height: 100%;
        display: block;
        pointer-events: none;
        user-select: none;
      }

      canvas.stage-layer {
        position: absolute;
        inset: 0;
        width: 100%;
        height: 100%;
        touch-action: none;
      }

      .tray {
        display: none;
      }

      .hud {
        position: absolute;
        left: 10px;
        bottom: calc(env(safe-area-inset-bottom) + -40px);
        display: flex;
        gap: 4px;
        z-index: 5;
      }

      .hud button {
        font-size: 18px;
        border: 0;
        background: transparent;
        color: #000;
        text-transform: uppercase;
        padding: 4px 8px;
        font-family: "ArchimotoV01-Regular", monospace, -apple-system, Segoe UI,
          Roboto, Helvetica, Arial, sans-serif;
      }

      .spray-cans {
        position: absolute;
        right: 10px;
        bottom: calc(env(safe-area-inset-bottom) - 145px);
        display: flex;
        gap: 10px;
        z-index: 5;
      }

      .spray-cans img {
        width: 35px;
        height: auto;
        object-fit: contain;
        object-position: center bottom;
        cursor: pointer;
        transition: width 0.2s ease, height 0.2s ease;
      }

      .spray-cans img.selected {
        width: 45px;
      }

      /* Small screens: keep cans smaller and OUTSIDE the canvas */
      @media (max-width: 768px) {
        .spray-cans {
          position: fixed;
          right: 12px;
          bottom: calc(env(safe-area-inset-bottom) + 12px);
          z-index: 10002;
          gap: 8px;
        }
        .spray-cans img {
          width: 26px;
        }
        .spray-cans img.selected {
          width: 32px;
        }
      }
    </style>
  </head>
  <body
    class="certificate"
    data-fixed-stencil="certificate"
    data-lock-stencil="true"
  >
    <div id="stencilApp">
      <div class="stage" id="certificateStage">
        <canvas id="stageBg" class="stage-bg"></canvas>

        <!-- Keep tray element for compatibility, but it stays hidden in this mode -->
        <div class="tray" id="stencilTray"></div>

        <!-- Layers: guide > stroke > paint -->
        <canvas id="paintCanvas" class="stage-layer"></canvas>
        <canvas id="strokeCanvas" class="stage-layer"></canvas>
        <canvas id="guideCanvas" class="stage-layer"></canvas>

        <div class="hud">
          <button class="reset-btn">Reset</button>
          <button class="post-btn">Export</button>
        </div>

        <div class="spray-cans">
          <img
            src="assets/spray-can-gold.png"
            alt="Spray Can Gold"
            class="spray-can-gold"
          />
          <img
            src="assets/spray-can-black.png"
            alt="Spray Can Black"
            class="spray-can-black"
          />
        </div>
      </div>
    </div>

    <script>
      // Keep the stage sized to the certificate asset aspect ratio (3266×1951).
      (function () {
        const FULL_W = 3266;
        const FULL_H = 1951;
        const CROP_TB = 0.0575; // 5.75% top and bottom
        const CROP_LR = 0.0256; // 2.56% left and right
        const cropRect = (w, h) => {
          const sx = Math.round(w * CROP_LR);
          const ex = Math.round(w * (1 - CROP_LR));
          const sy = Math.round(h * CROP_TB);
          const ey = Math.round(h * (1 - CROP_TB));
          return { sx, sy, sw: Math.max(1, ex - sx), sh: Math.max(1, ey - sy) };
        };
        const fullAR = FULL_W / FULL_H;
        const cr = cropRect(FULL_W, FULL_H);
        const cropAR = cr.sw / cr.sh;
        const stage = document.getElementById("certificateStage");
        const bgCanvas = document.getElementById("stageBg");
        if (!stage) return;

        const bgImg = new Image();
        bgImg.src = "assets/certificate-stencil-bg.jpg";
        // bgImg.src = "assets/canvas-bg.png";

        function fitStage() {
          const isDesktop = window.matchMedia("(min-width: 1024px)").matches;
          const isSmall = window.matchMedia("(max-width: 768px)").matches;
          const AR = isSmall ? cropAR : fullAR;
          const maxW = Math.min(
            window.innerWidth * (isDesktop ? 0.9 : 0.95),
            isDesktop ? 1280 : 820
          );
          // Leave a bit more room on small screens so fixed controls don't overlap the stage
          const maxH =
            window.innerHeight * (isDesktop ? 0.85 : isSmall ? 0.7 : 0.78);
          let w = maxW;
          let h = w / AR;
          if (h > maxH) {
            h = maxH;
            w = h * AR;
          }
          // Round in a way that preserves aspect ratio at pixel level
          let wPx = Math.round(w);
          let hPx = Math.round(wPx / AR);
          if (hPx > maxH) {
            hPx = Math.round(maxH);
            wPx = Math.round(hPx * AR);
          }
          stage.style.width = wPx + "px";
          stage.style.height = hPx + "px";

          // (Re)draw background to match the current stage size & crop mode
          drawBg();
        }

        function drawBg() {
          if (!bgCanvas) return;
          const isSmall = window.matchMedia("(max-width: 768px)").matches;
          const dpr = Math.max(1, window.devicePixelRatio || 1);
          const w = Math.max(1, stage.clientWidth | 0);
          const h = Math.max(1, stage.clientHeight | 0);
          bgCanvas.width = Math.round(w * dpr);
          bgCanvas.height = Math.round(h * dpr);
          bgCanvas.style.width = "100%";
          bgCanvas.style.height = "100%";
          const g = bgCanvas.getContext("2d");
          g.setTransform(dpr, 0, 0, dpr, 0, 0);
          g.clearRect(0, 0, w, h);
          if (!bgImg.complete || !bgImg.naturalWidth) return;
          const srcW = bgImg.naturalWidth || FULL_W;
          const srcH = bgImg.naturalHeight || FULL_H;
          const r = isSmall
            ? cropRect(srcW, srcH)
            : { sx: 0, sy: 0, sw: srcW, sh: srcH };
          g.imageSmoothingEnabled = true;
          g.imageSmoothingQuality = "high";
          g.drawImage(bgImg, r.sx, r.sy, r.sw, r.sh, 0, 0, w, h);
        }

        fitStage();
        window.addEventListener("resize", fitStage, { passive: true });
        bgImg.onload = drawBg;
      })();
    </script>
    <script src="js/spray.js"></script>
    <script src="js/stencil-app.js"></script>
  </body>
</html>
